<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="1080" viewBox="0 0 1080 1080"><rect width="1080" height="1080" fill="#0F4A2E"/><text x="80" y="110" fill="#FFFDF8" font-family="Sora,Arial,sans-serif" font-size="26" letter-spacing="3">BOOK DISCUSSION</text><rect x="80" y="170" width="100" height="12" fill="#EE6A1B"/><text x="74" y="310" fill="#FFFDF8" font-family="Sora,Arial,sans-serif" font-size="88" font-weight="800" letter-spacing="-3">One ending.</text><text x="74" y="415" fill="#FFFDF8" font-family="Sora,Arial,sans-serif" font-size="88" font-weight="800" letter-spacing="-3">More than one</text><text x="74" y="520" fill="#FFFDF8" font-family="Sora,Arial,sans-serif" font-size="88" font-weight="800" letter-spacing="-3">reading.</text><foreignObject x="80" y="645" width="900" height="200"><div xmlns="http://www.w3.org/1999/xhtml" style="font:36px/1.5 Sora,Arial,sans-serif;color:#FFFDF8">Did the final page change how you understood the first?</div></foreignObject><line x1="80" x2="1000" y1="920" y2="920" stroke="#FFFDF8" opacity=".35"/><text x="80" y="990" fill="#FFFDF8" font-family="Sora,Arial,sans-serif" font-size="34" font-weight="700">Chapter Zero</text><text x="1000" y="990" text-anchor="end" fill="#FFFDF8" font-family="Sora,Arial,sans-serif" font-size="18">Every story starts here.</text></svg>